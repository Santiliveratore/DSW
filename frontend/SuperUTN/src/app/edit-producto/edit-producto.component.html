<section class="min-h-[calc(100vh-70px)] bg-gray-50 py-12 px-4 flex justify-center items-start">
  
  <div class="container max-w-5xl w-full">
    
    <div class="mb-8 flex justify-between items-center">
      <div>
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Editar Producto</h2>
        <p class="text-gray-500 mt-1">Actualiza la información y la imagen de tu producto.</p>
      </div>
      <a routerLink="/" class="hidden md:flex items-center gap-2 text-gray-500 hover:text-gray-700 transition-colors font-medium">
        <i class="fa-solid fa-arrow-left"></i> Volver al catálogo
      </a>
    </div>

    <form [formGroup]="productoForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data" 
          class="bg-white rounded-3xl shadow-xl shadow-gray-200/50 border border-gray-100 overflow-hidden">
      
      <div class="grid grid-cols-1 lg:grid-cols-3">
        
        <div class="p-8 bg-gray-50/50 border-b lg:border-b-0 lg:border-r border-gray-100 flex flex-col items-center justify-center">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-4 self-start">Vista Previa</label>
          
          <div class="relative group w-full aspect-square max-w-[280px] bg-white rounded-2xl shadow-sm border border-gray-200 flex items-center justify-center overflow-hidden mb-6">
            
            <img *ngIf="imagePreview; else showOriginalImage" 
                 [src]="imagePreview" 
                 alt="Vista previa" 
                 class="object-contain w-full h-full p-4 transition-transform duration-500 group-hover:scale-105">
            
            <ng-template #showOriginalImage>
              <img [src]="'http://localhost:3000/productos/' + producto?.foto" 
                   alt="Imagen Original" 
                   class="object-contain w-full h-full p-4 transition-transform duration-500 group-hover:scale-105">
            </ng-template>

            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors pointer-events-none"></div>
          </div>

          <div class="w-full max-w-[280px]">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Cambiar Imagen</label>
            <input formControlName="foto"
                   type="file" 
                   id="foto" 
                   (change)="onFileSelected($event)" 
                   class="block w-full text-sm text-gray-500
                          file:mr-4 file:py-2.5 file:px-4
                          file:rounded-full file:border-0
                          file:text-sm file:font-bold
                          file:bg-blue-50 file:text-blue-700
                          hover:file:bg-blue-100
                          cursor-pointer transition-all">
            <p class="text-[10px] text-gray-400 mt-2 text-center">Formatos: JPG, PNG, WEBP</p>
          </div>
        </div>

        <div class="p-8 lg:col-span-2 flex flex-col justify-between">
          <div class="space-y-6">
            
            <div class="relative">
              <label for="nombre" class="leading-7 text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Nombre del Producto</label>
              <div class="relative mt-1">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                  <i class="fa-solid fa-tag"></i>
                </div>
                <input formControlName="nombre" id="nombre" type="text" 
                       placeholder="{{producto?.nombre}}"
                       class="w-full bg-white rounded-xl border-2 border-gray-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 text-base outline-none text-gray-700 py-3 pl-10 pr-4 transition-all duration-200">
              </div>
            </div>

            <div class="relative">
              <label for="descripcion" class="leading-7 text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Descripción Detallada</label>
              <div class="relative mt-1">
                 <div class="absolute top-3 left-3 pointer-events-none text-gray-400">
                  <i class="fa-solid fa-align-left"></i>
                </div>
                <textarea formControlName="descripcion" id="descripcion" rows="6" 
                          placeholder="{{producto?.descripcion}}"
                          class="w-full bg-white rounded-xl border-2 border-gray-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 text-base outline-none text-gray-700 py-3 pl-10 pr-4 transition-all duration-200 resize-none"></textarea>
              </div>
              <p class="text-xs text-gray-400 mt-1 text-right">Se recomienda una descripción breve y clara.</p>
            </div>

          </div>

          <div class="mt-10 flex flex-col sm:flex-row items-center gap-4 pt-6 border-t border-gray-100">
            <button type="submit" 
                    class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-200 hover:shadow-blue-300 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
            </button>
            
            <a routerLink="/" 
               class="w-full sm:w-auto text-center text-gray-500 font-bold hover:bg-gray-100 py-3 px-6 rounded-xl transition-colors cursor-pointer">
              Cancelar
            </a>
          </div>
        </div>

      </div>
    </form>
  </div>
</section>
