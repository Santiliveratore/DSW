<nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 shadow-sm w-full">
  <div class="container mx-auto px-4 py-3">
    
    <div class="flex justify-between items-center md:hidden">
      <span class="font-bold text-gray-800 text-lg">Catálogo</span>
      <button (click)="dropdownOpen = !dropdownOpen" 
              class="p-2 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors focus:outline-none">
        <i class="fa-solid fa-bars" *ngIf="!dropdownOpen"></i>
        <i class="fa-solid fa-xmark" *ngIf="dropdownOpen"></i>
      </button>
    </div>

    <div class="dropdown-menu mt-2 md:mt-0 w-full md:flex md:justify-center md:items-center md:space-x-2 md:opacity-100 md:max-h-full" 
         [class.open]="dropdownOpen">
      
      <button 
        (click)="getProductos(); dropdownOpen = false" 
        [ngClass]="selectedCategory === 'Todo' ? 'bg-blue-600 text-white shadow-md' : 'bg-transparent text-gray-500 hover:bg-gray-50 hover:text-blue-600'"
        class="w-full md:w-auto px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 mb-2 md:mb-0 text-left md:text-center">
        Todo
      </button>

      <button *ngFor="let categoria of categorias"
        (click)="filtrarProductos(categoria.id); dropdownOpen = false" 
        [ngClass]="selectedCategory === categoria.id ? 'bg-blue-600 text-white shadow-md' : 'bg-transparent text-gray-500 hover:bg-gray-50 hover:text-blue-600'"
        class="w-full md:w-auto px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 mb-1 md:mb-0 text-left md:text-center">
        {{categoria.nombre}}
      </button>
    </div>
  </div>
</nav>

<section class="bg-gradient-to-br from-blue-50 via-white to-gray-100 min-h-screen text-gray-600 body-font">
  <div class="container px-5 py-12 mx-auto">
    
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
      
      <div class="group relative bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 overflow-hidden flex flex-col" 
           *ngFor="let producto of productos">
        
        <div class="absolute top-3 left-3 z-10">
           <span class="bg-white/90 backdrop-blur text-xs font-bold text-gray-500 px-2 py-1 rounded-md shadow-sm border border-gray-100">
             {{producto.tipo.descripcion}}
           </span>
        </div>

        <a class="relative block h-64 bg-gray-50 overflow-hidden cursor-pointer group-hover:bg-gray-100 transition-colors">
          <img class="object-contain object-center w-full h-full p-6 transition-transform duration-500 group-hover:scale-110 mix-blend-multiply" 
               [src]="'http://localhost:3000/productos/' + producto.foto" 
               alt="{{ producto.nombre }}">
        </a>

        <div class="p-5 flex-grow flex flex-col justify-between">
          <div>
            <h3 class="text-gray-400 text-xs tracking-widest title-font mb-1 uppercase font-semibold">
              {{ producto.descripcion | slice:0:30 }}{{ producto.descripcion.length > 30 ? '...' : '' }}
            </h3>
            <h2 class="text-gray-900 title-font text-lg font-bold leading-tight mb-2 group-hover:text-blue-600 transition-colors">
              {{ producto.nombre }}
            </h2>
          </div>
          
          <div class="mt-4 flex items-center justify-between">
            <p class="text-2xl font-bold text-gray-900">${{ producto.precio }}</p>
            
            <div *ngIf="isAdmin()" class="flex space-x-3">
              <a routerLink="/editProducto/{{producto.id}}" 
                 class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center hover:bg-blue-600 hover:text-white transition-all shadow-sm">
                 <i class="fa-solid fa-pen text-sm"></i>
              </a>
              <button (click)="eliminarProducto(producto.id, producto.foto)"
                      class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition-all shadow-sm">
                 <i class="fa-solid fa-trash text-sm"></i>
              </button>
            </div>

            <div *ngIf="isAdmin()===false" class="relative">
              <button (click)="agregarAlCarrito(producto, 1)"
                      class="bg-blue-600 hover:bg-blue-700 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md hover:shadow-lg transform active:scale-95 transition-all">
                <i class="fa-solid fa-plus"></i>
              </button>
              
              <span *ngIf="obtenerCantidadProductoEnCarrito(producto.id) > 0"
                    class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white shadow-sm animate-bounce-short">
                {{ obtenerCantidadProductoEnCarrito(producto.id) }}
              </span>
            </div>
          </div>
        </div>
      </div>
      </div>
  </div>
</section>
