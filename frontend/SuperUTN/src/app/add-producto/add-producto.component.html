<section class="min-h-[calc(100vh-70px)] bg-gray-50 py-12 px-4 flex justify-center items-start">
  
  <div class="container max-w-5xl w-full">
    
    <div class="mb-8 flex justify-between items-center">
      <div>
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Nuevo Producto</h2>
        <p class="text-gray-500 mt-1">Completa la información para añadir un item al catálogo.</p>
      </div>
      <a routerLink="/" class="hidden md:flex items-center gap-2 text-gray-500 hover:text-gray-700 transition-colors font-medium">
        <i class="fa-solid fa-arrow-left"></i> Volver
      </a>
    </div>

    <form [formGroup]="productoForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data" 
          class="bg-white rounded-3xl shadow-xl shadow-gray-200/50 border border-gray-100 overflow-hidden">
      
      <div class="grid grid-cols-1 lg:grid-cols-3 min-h-[500px]">
        
        <div class="p-8 bg-gray-50/50 border-b lg:border-b-0 lg:border-r border-gray-100 flex flex-col items-center justify-center relative">
          
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-4 self-start">Imagen del Producto</label>

          <div class="relative w-full aspect-square max-w-[280px] bg-white rounded-2xl border-2 border-dashed border-gray-300 hover:border-blue-400 hover:bg-blue-50/30 transition-all flex flex-col items-center justify-center overflow-hidden group cursor-pointer">
            
            <div *ngIf="imagePreview" class="absolute inset-0 z-10 bg-white flex items-center justify-center">
               <img [src]="imagePreview" alt="Vista previa" class="object-contain w-full h-full p-2">
               <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                 <p class="text-white font-bold text-sm"><i class="fa-solid fa-pen"></i> Cambiar imagen</p>
               </div>
            </div>

            <div *ngIf="!imagePreview" class="text-center p-6 pointer-events-none">
              <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
              </div>
              <p class="text-sm font-bold text-gray-700">Sube una imagen</p>
              <p class="text-xs text-gray-400 mt-1">JPG, PNG o WEBP</p>
            </div>

            <input formControlName="foto" 
                   type="file" 
                   id="foto" 
                   (change)="onFileSelected($event)" 
                   class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
          </div>

          <div *ngIf="productoForm.get('foto')?.invalid && productoForm.get('foto')?.touched" class="text-red-500 text-xs mt-3 font-bold animate-pulse">
            <i class="fa-solid fa-circle-exclamation"></i> La imagen es obligatoria.
          </div>
        </div>

        <div class="p-8 lg:col-span-2 flex flex-col">
          <h3 class="text-lg font-bold text-gray-900 mb-6 border-b border-gray-100 pb-2">Información General</h3>
          
          <div class="space-y-6 flex-grow">
            
            <div class="relative">
              <label for="nombre" class="leading-7 text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Nombre</label>
              <div class="relative mt-1">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                  <i class="fa-solid fa-tag"></i>
                </div>
                <input formControlName="nombre" id="nombre" type="text" placeholder="Ej: Arroz Gallo Oro 1kg"
                       class="w-full bg-white rounded-xl border-2 border-gray-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 text-base outline-none text-gray-700 py-2.5 pl-10 pr-4 transition-all">
              </div>
              <div *ngIf="productoForm.get('nombre')?.invalid && productoForm.get('nombre')?.touched" class="text-red-500 text-[10px] mt-1 ml-1 font-bold">
                * Nombre requerido.
              </div>
            </div>

            <div class="relative">
              <label for="descripcion" class="leading-7 text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Descripción</label>
              <textarea formControlName="descripcion" id="descripcion" rows="3" placeholder="Detalles del producto..."
                        class="w-full mt-1 bg-white rounded-xl border-2 border-gray-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 text-base outline-none text-gray-700 py-2.5 px-4 transition-all resize-none"></textarea>
              <div *ngIf="productoForm.get('descripcion')?.invalid && productoForm.get('descripcion')?.touched" class="text-red-500 text-[10px] mt-1 ml-1 font-bold">
                * Descripción requerida.
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              <div class="relative">
                <label for="precio" class="leading-7 text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Precio</label>
                <div class="relative mt-1">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 font-bold">
                    $
                  </div>
                  <input formControlName="precio" id="precio" type="number" placeholder="0.00"
                         class="w-full bg-white rounded-xl border-2 border-gray-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 text-base outline-none text-gray-700 py-2.5 pl-8 pr-4 transition-all">
                </div>
                <div *ngIf="productoForm.get('precio')?.invalid && productoForm.get('precio')?.touched" class="text-red-500 text-[10px] mt-1 ml-1 font-bold">
                  * Requerido.
                </div>
              </div>

              <div class="relative">
                <label for="categoria" class="leading-7 text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Categoría</label>
                <div class="relative mt-1">
                  <select formControlName="categoria" id="categoria" 
                          class="w-full bg-white rounded-xl border-2 border-gray-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 text-base outline-none text-gray-700 py-2.5 px-4 appearance-none transition-all cursor-pointer">
                    <option value="" disabled selected>Seleccionar...</option>
                    <option *ngFor="let categoria of categorias" [value]="categoria.id">{{categoria.nombre}}</option>
                  </select>
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                  </div>
                </div>
                <div *ngIf="productoForm.get('categoria')?.invalid && productoForm.get('categoria')?.touched" class="text-red-500 text-[10px] mt-1 ml-1 font-bold">
                   * Selecciona una.
                </div>
              </div>

              <div class="relative md:col-span-2">
                <label for="tipo" class="leading-7 text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">Tipo de Producto</label>
                <div class="relative mt-1">
                   <select formControlName="tipo" id="tipo" 
                          class="w-full bg-white rounded-xl border-2 border-gray-100 focus:border-blue-500 focus:ring-4 focus:ring-blue-50 text-base outline-none text-gray-700 py-2.5 px-4 appearance-none transition-all cursor-pointer">
                    <option value="" disabled selected>Seleccionar tipo...</option>
                    <option *ngFor="let tipo of tipos" [value]="tipo.id">{{tipo.descripcion}}</option>
                  </select>
                  <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                  </div>
                </div>
                <div *ngIf="productoForm.get('tipo')?.invalid && productoForm.get('tipo')?.touched" class="text-red-500 text-[10px] mt-1 ml-1 font-bold">
                   * Selecciona un tipo.
                </div>
              </div>

            </div>
          </div>

          <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-lg mt-4 text-sm font-medium border border-red-100 flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ errorMessage }}
          </div>

          <div class="mt-8 pt-6 border-t border-gray-100 flex justify-end">
            <button type="submit" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-200 hover:shadow-blue-300 transform active:scale-[0.98] transition-all flex items-center gap-2">
              <i class="fa-solid fa-plus"></i> Crear Producto
            </button>
          </div>

        </div>
      </div>
    </form>
  </div>
</section>
