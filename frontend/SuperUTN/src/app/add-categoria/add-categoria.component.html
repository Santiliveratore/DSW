<section class="min-h-[calc(100vh-70px)] bg-gray-50 flex items-center justify-center py-12 px-4">
  
  <div class="max-w-md w-full">
    <a routerLink="/" class="inline-flex items-center gap-2 text-sm font-medium text-gray-400 hover:text-blue-600 transition-colors mb-6 group">
      <i class="fa-solid fa-arrow-left transition-transform group-hover:-translate-x-1"></i> 
      Volver al panel
    </a>

    <div class="bg-white rounded-3xl shadow-xl shadow-gray-200/60 border border-gray-100 overflow-hidden">
      <div class="bg-blue-600 p-8 text-center">
        <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4 backdrop-blur-sm border border-white/30">
          <i class="fa-solid fa-layer-group text-white text-2xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">Nueva Categoría</h2>
        <p class="text-blue-100 text-sm mt-1">Organiza mejor tus productos</p>
      </div>

      <form [formGroup]="categoriaForm" (ngSubmit)="onSubmit()" class="p-8 space-y-6">
        
        <div class="relative">
          <label for="nombre" class="leading-7 text-xs font-bold uppercase tracking-wider text-gray-500 ml-1">
            Nombre de la Categoría
          </label>
          <div class="relative mt-1">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
              <i class="fa-solid fa-pen-nib"></i>
            </div>
            <input formControlName="nombre" id="nombre" type="text" 
                   placeholder="Ej: Lácteos, Bebidas, Limpieza..."
                   class="w-full bg-gray-50 rounded-xl border-2 border-transparent focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-50 text-base outline-none text-gray-700 py-3 pl-11 pr-4 transition-all duration-200">
          </div>
          
          <div *ngIf="categoriaForm.get('nombre')?.invalid && categoriaForm.get('nombre')?.touched" 
               class="flex items-center gap-1 text-red-500 text-[11px] mt-2 font-bold animate-fade-in">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>Este campo es obligatorio para continuar.</span>
          </div>
        </div>

        <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-xl text-sm font-medium border border-red-100 flex items-center gap-2 animate-bounce-short">
          <i class="fa-solid fa-triangle-exclamation"></i> {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="bg-green-50 text-green-600 p-3 rounded-xl text-sm font-medium border border-green-100 flex items-center gap-2 animate-fade-in">
          <i class="fa-solid fa-circle-check"></i> {{ successMessage }}
        </div>

        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-100 hover:shadow-blue-200 transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-lg">
          <i class="fa-solid fa-plus-circle"></i> Crear Categoría
        </button>
      </form>
    </div>

    <p class="text-center text-gray-400 text-xs mt-8 uppercase tracking-widest font-medium">
      SuperUTN Admin System v2.0
    </p>
  </div>

</section>
